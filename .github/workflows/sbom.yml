name: Python SBOM

on:
  pull_request:
    paths:
      - "jobradar/requirements*.txt"
      - "requirements_test.txt"
      - ".github/workflows/sbom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: ${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: runtime
            python-version: "3.12"
            requirements: "-r jobradar/requirements.txt"
            output: sbom-runtime-python.cdx.json
          - scope: standalone-tests
            python-version: "3.12"
            requirements: "-r jobradar/requirements.txt -r jobradar/requirements-dev.txt"
            output: sbom-standalone-tests-python.cdx.json
          - scope: ha-integration-tests
            python-version: "3.13"
            requirements: "-r requirements_test.txt"
            output: sbom-ha-integration-tests-python.cdx.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SBOM generator
        run: python -m pip install --upgrade pip cyclonedx-bom
      - name: Resolve dependencies in a clean environment
        run: |
          python -m venv .venv-sbom
          .venv-sbom/bin/python -m pip install --upgrade pip
          .venv-sbom/bin/python -m pip install ${{ matrix.requirements }}
          .venv-sbom/bin/python -m pip freeze > resolved-${{ matrix.scope }}.txt
      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements resolved-${{ matrix.scope }}.txt \
            --output-format JSON \
            --output-file ${{ matrix.output }}
      - name: Upload SBOM and resolved package list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-${{ matrix.scope }}-sbom
          path: |
            ${{ matrix.output }}
            resolved-${{ matrix.scope }}.txt
          if-no-files-found: error
          retention-days: 90

  runtime-lock:
    name: Compile and verify runtime hash lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.2"
      - name: Compile SHA-256 locked runtime dependencies
        run: |
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=jobradar/requirements.lock \
            jobradar/requirements.txt
      - name: Check committed lockfile is up to date
        shell: bash
        run: |
          if git ls-files --error-unmatch jobradar/requirements.lock >/dev/null 2>&1; then
            git diff --exit-code -- jobradar/requirements.lock
          else
            echo "No committed lockfile yet; generated lock will be uploaded for review."
          fi
      - name: Verify hash-checked installation
        run: |
          python -m venv .venv-lock-check
          .venv-lock-check/bin/python -m pip install --disable-pip-version-check --require-hashes -r jobradar/requirements.lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-runtime-hash-lock
          path: jobradar/requirements.lock
          if-no-files-found: error
          retention-days: 90
