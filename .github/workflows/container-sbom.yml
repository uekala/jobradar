name: Container image SBOM

on:
  pull_request:
    paths:
      - "jobradar/**"
      - ".github/workflows/container-sbom.yml"
  push:
    branches:
      - main
    paths:
      - "jobradar/**"
      - ".github/workflows/container-sbom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-sbom:
    name: ARM64 container SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Record candidate Python base image digest
        run: |
          docker buildx imagetools inspect python:3.12.16-slim-trixie | tee python-base-manifest.txt

      - name: Upload candidate base image manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-trixie-base-manifest
          path: python-base-manifest.txt
          if-no-files-found: error
          retention-days: 90

      - name: Build ARM64 image locally (no publish)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./jobradar
          platforms: linux/arm64
          push: false
          load: true
          tags: local/jobradar:sbom-arm64

      - name: Inspect ARM64 runtime SQLite and native-library profile
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint python local/jobradar:sbom-arm64 -c '
          import ctypes.util
          import json
          import os
          import platform
          import sqlite3
          import sys

          db = sqlite3.connect(":memory:")
          options = sorted(row[0] for row in db.execute("PRAGMA compile_options"))
          fts5 = False
          try:
              db.execute("CREATE VIRTUAL TABLE temp.runtime_fts_probe USING fts5(content)")
              db.execute("DROP TABLE temp.runtime_fts_probe")
              fts5 = True
          except sqlite3.OperationalError:
              pass

          maps = set()
          try:
              with open("/proc/self/maps", encoding="utf-8") as handle:
                  for line in handle:
                      path = line.split()[-1]
                      if path.startswith("/") and (".so" in path or "ld-linux" in path):
                          maps.add(path)
          except OSError:
              pass

          status = {}
          with open("/proc/self/status", encoding="utf-8") as handle:
              for line in handle:
                  if line.startswith(("Uid:", "Gid:", "CapEff:", "NoNewPrivs:")):
                      key, value = line.split(":", 1)
                      status[key] = value.strip()

          print(json.dumps({
              "python_version": sys.version,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "sqlite_python_module_version": sqlite3.version,
              "sqlite_library_version": sqlite3.sqlite_version,
              "sqlite_compile_options": options,
              "sqlite_fts5_probe": fts5,
              "sqlite_session_compile_option": "ENABLE_SESSION" in options,
              "native_libraries_loaded": sorted(maps),
              "find_library_libstdcxx": ctypes.util.find_library("stdc++"),
              "process_security_status": status,
          }, indent=2, sort_keys=True))
          ' | tee jobradar-arm64-runtime-profile.json

      - name: Upload ARM64 runtime profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-arm64-runtime-profile
          path: jobradar-arm64-runtime-profile.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan ARM64 image for OS and application vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: local/jobradar:sbom-arm64
          fail-build: false
          output-format: json
          output-file: grype-jobradar-container-arm64.json

      - name: Upload ARM64 vulnerability scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-container-arm64-vulnerability-scan
          path: grype-jobradar-container-arm64.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce ARM64 vulnerability threshold after report upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="grype-jobradar-container-arm64.json"
          if [[ ! -s "$report" ]]; then
            echo "::error::Grype JSON report is missing; refusing to treat the image as clean."
            exit 1
          fi
          jq -r '
            [.matches[]? |
              select((.vulnerability.severity // "Unknown" | ascii_upcase) as $severity |
                ["MEDIUM", "HIGH", "CRITICAL"] | index($severity))] as $findings |
            "Findings at Medium or higher: \($findings | length)",
            ($findings[]? |
              [
                (.vulnerability.severity // "Unknown"),
                (.vulnerability.id // "unknown-id"),
                (.artifact.name // "unknown-package"),
                (.artifact.version // "unknown-version")
              ] | @tsv)
          ' "$report"
          count="$(jq '[.matches[]? | select((.vulnerability.severity // "Unknown" | ascii_upcase) as $severity | ["MEDIUM", "HIGH", "CRITICAL"] | index($severity))] | length' "$report")"
          if [[ "$count" -gt 0 ]]; then
            echo "::error::$count vulnerability finding(s) at Medium or higher. Review the uploaded Grype report."
            exit 1
          fi

      - name: Generate CycloneDX SBOM from ARM64 image
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/jobradar:sbom-arm64
          format: cyclonedx-json
          output-file: sbom-jobradar-container-arm64.cdx.json
          artifact-name: jobradar-container-arm64-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.57.1

      - name: Verify SBOM contains Debian OS packages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s sbom-jobradar-container-arm64.cdx.json
          component_count="$(jq '.components | length' sbom-jobradar-container-arm64.cdx.json)"
          debian_count="$(jq '[.components[]? | select((.purl // "") | startswith("pkg:deb/"))] | length' sbom-jobradar-container-arm64.cdx.json)"
          echo "SBOM components: ${component_count}"
          echo "Debian package components: ${debian_count}"
          test "${component_count}" -gt 0
          test "${debian_count}" -gt 0
