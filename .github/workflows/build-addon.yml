name: Build Home Assistant add-on

on:
  push:
    branches:
      - main
      - ha-green-foundation
      - consolidate-legacy-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build ARM64 add-on (no publish)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./jobradar
          platforms: linux/arm64
          push: false
          tags: local/jobradar:ci
          build-args: |
            BUILD_FROM=python:3.12-slim-bookworm
