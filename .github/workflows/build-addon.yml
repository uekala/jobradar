name: Build Home Assistant add-on

on:
  push:
    branches:
      - main
      - ha-green-foundation
      - consolidate-legacy-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ARM64 add-on (no publish)
        uses: docker/build-push-action@v6
        with:
          context: ./jobradar
          platforms: linux/arm64
          push: false
          tags: local/jobradar:ci
          build-args: |
            BUILD_FROM=python:3.12-slim-bookworm
