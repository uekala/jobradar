name: Runtime dependency lock

on:
  pull_request:
    paths:
      - "jobradar/requirements.txt"
      - "jobradar/requirements.lock"
      - ".github/workflows/runtime-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobradar
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.2"

      - name: Compile SHA-256 locked runtime dependencies
        run: |
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements.lock \
            requirements.txt

      - name: Check committed lockfile is up to date
        shell: bash
        run: |
          if git ls-files --error-unmatch requirements.lock >/dev/null 2>&1; then
            git diff --exit-code -- requirements.lock
          else
            echo "No committed lockfile yet; generated lock will be uploaded for review."
          fi

      - name: Verify hash-checked installation
        run: |
          python -m venv .venv-lock-check
          .venv-lock-check/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Upload generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobradar-runtime-hash-lock
          path: jobradar/requirements.lock
          if-no-files-found: error
          retention-days: 90
