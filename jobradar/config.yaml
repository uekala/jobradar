name: Jobradar
version: "0.5.1"
slug: jobradar
description: "Eigenständiger, lokaler Jobradar für Home Assistant Green"
url: https://github.com/uekala/jobradar
arch:
  - aarch64
startup: application
boot: auto
init: false
# Home Assistant stops the app while it backs up /data, so the SQLite file
# in the backup is always consistent.
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:briefcase-search
panel_title: Jobradar
# The daily search run tells Home Assistant about new vacancies through a
# notify service, so the app needs access to the Home Assistant API.
homeassistant_api: true
options:
  search_time: "06:30"
  notify_service: ""
  notify_min_score: 70
schema:
  search_time: "match(^(|([01][0-9]|2[0-3]):[0-5][0-9])$)"
  notify_service: "str?"
  notify_min_score: "int(0,100)"
