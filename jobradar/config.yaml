name: Jobradar
version: "0.6.0"
slug: jobradar
description: "Eigenständiger, lokaler Jobradar für Home Assistant Green"
url: https://github.com/uekala/jobradar
arch:
  - aarch64
startup: application
boot: auto
init: false
# Home Assistant stoppt die App, während es /data sichert, deshalb ist die
# SQLite-Datei im Backup immer konsistent.
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:briefcase-search
panel_title: Jobradar
# Der tägliche Suchlauf meldet neue Stellen über einen Notify-Dienst an
# Home Assistant, deshalb braucht die App Zugriff auf die Home-Assistant-API.
homeassistant_api: true
options:
  search_time: "06:30"
  notify_service: ""
  notify_min_score: 70
schema:
  search_time: "match(^(|([01][0-9]|2[0-3]):[0-5][0-9])$)"
  notify_service: "str?"
  notify_min_score: "int(0,100)"
